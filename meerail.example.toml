# meerail configuration — one file for the whole system.
#
# Copy to meerail.toml and edit:
#
#   cp meerail.example.toml meerail.toml && chmod 600 meerail.toml
#
# Both processes read this same file: the web app takes [database] and
# [server], the agent takes [database] and [agent]. Each ignores the other's
# section, so a machine running only one of them just leaves the rest at its
# default.
#
# EVERY setting here can be overridden by an environment variable of the same
# name in upper case — server.password is SERVER_PASSWORD, database.url is
# DATABASE_URL, agent.store_raw_mime is STORE_RAW_MIME. The environment wins
# over this file, and a .env beside it sits between the two:
#
#   environment  >  .env  >  meerail.toml  >  built-in default
#
# That order is what lets a remote server run with no file at all: drop the
# bind mount from docker-compose.yml and pass DATABASE_URL and SECRET_KEY in
# the environment instead. It is also why nothing should set a variable it does
# not mean — an `environment:` entry with a ${VAR:-default} fallback is always
# set, and would override whatever you write here.
#
# This file holds mailbox passwords in plaintext. Keep it mode 0600; the agent's
# --test refuses to pass if anyone else can read it.


# --- database -----------------------------------------------------------------
# The only channel between the agent and the web app.
[database]
# docker-compose publishes the bundled Postgres on the host's loopback, so this
# address works for a native agent, `make dev`, and the host-network agent
# container alike. The containers on the compose network are handed db:5432 in
# their environment instead, which overrides this line.
#
# If you change POSTGRES_PASSWORD in .env, change it here too — the Postgres
# image only takes its credentials from the environment (that is Docker's
# contract, not ours), so that one value genuinely does live in two places.
url = "postgresql+psycopg://meerail:meerail@127.0.0.1:5432/meerail"


# --- server -------------------------------------------------------------------
[server]
# Encrypts server-side stored credentials and signs session cookies.
# CHANGE THIS. Generate: python -c "import secrets;print(secrets.token_urlsafe(48))"
secret_key = "dev-insecure-secret-change-me"

# Password gating the web UI / REST API. Empty = open, which is right for a
# localhost install; set it before exposing the server to the internet. The
# browser asks once, then holds a signed session cookie.
#
# Setting this also turns on the HTTPS requirement: with a password configured,
# nothing at all is served over a plaintext connection. Not just the login
# route — the UI itself, because a browser that gets the page gets the password
# form, and by the time the form is submitted the password has crossed the
# network whatever the server then says about it. A plain http:// GET is
# redirected to https://; anything else is refused.
#
# Loopback is exempt (nothing leaves the machine), and a deployment whose TLS is
# terminated by a proxy needs `trusted_proxies` below so that the app can see
# the connection was encrypted — without it every request looks like plaintext
# and the whole install answers with the message saying so.
password = ""

# Credential for scripted clients: `Authorization: Bearer <token>`. Empty means
# the API can only be reached with a browser session. Deliberately not the UI
# password: that one is typed into a browser, and accepting it here as well made
# it a permanent key to the whole mailbox that could only be taken back by
# changing the password and signing every browser out.
# Generate: python -c "import secrets;print(secrets.token_urlsafe(32))"
api_token = ""

# How long a browser login lasts before the password is asked again. Changing
# `password` or `secret_key` logs every browser out immediately; Log out ends
# the one session that asked, wherever its cookie has got to.
session_max_age_days = 30

# Reverse proxies this server may believe about where a request came from, as a
# comma-separated list of IPs or CIDR blocks. Empty trusts nothing, which is
# right when the browser talks to this server directly.
#
# Set it whenever TLS is terminated in front — a Traefik, a Caddy, an nginx.
# Without it every request looks like plain HTTP from the proxy's own address,
# so the session cookie goes out without Secure, and the login rate limiter
# counts one attacker's failures against every user behind the proxy and locks
# them all out. With it, X-Forwarded-For and X-Forwarded-Proto are read — but
# only from these addresses, because anything that can reach the port can set
# those headers.
trusted_proxies = ""

# How long a browser remembers to reach this install over HTTPS only — the
# Strict-Transport-Security max-age, in days. 0 sends no such header.
#
# It is what removes the *first* plaintext request rather than turning it away:
# a browser that has been here once will not speak http:// to this hostname
# again for this long, and will not offer a way past a bad certificate either.
# That is a promise with a duration, so set it to 0 while you are still moving
# the install between hostnames, and leave it at a year once it has settled.
# Only ever sent over HTTPS, so a localhost install never sees it.
hsts_max_age_days = 365

# Largest ordinary request body the server will read, in bytes; 0 is no limit.
# Not the attachment cap below — uploads get that one. This bounds JSON: a
# composed message's text, a list of ids. It is checked before the body is read
# and before the request is authenticated, which is the point of it: FastAPI
# parses a body before it runs the dependency that would have said 401, so
# without a ceiling a stranger decides what an unauthenticated POST costs.
#
# A reverse proxy in front should have its own limit as well — it can refuse
# the connection without waking Python at all. See COOLIFY.md.
max_request_bytes = 8388608   # 8 MB

# Let "Add Task" point at a Meerato on a private address (10.x, 192.168.x, a
# container name, localhost). Off by default: the URL is typed into Settings and
# then fetched by the *server*, so without a restriction it is a way to aim this
# machine at whatever else is on its network. Turn it on when Meerato really is
# a peer service on your own network.
meerato_allow_private_hosts = false

# Default search window in years (0 = search everything). The UI can override
# it per query.
default_search_years = 0

# How many years back to scan from/to/cc/bcc addresses when building the
# compose autocomplete list (0 = all time).
contacts_scan_years = 1

# Per-attachment cap for outgoing (compose) uploads, in bytes.
max_attachment_bytes = 104857600  # 100 MB

# Seconds a sent message waits in the Outbox before the agent may relay it —
# the window in which you can still call it back. 0 sends at the first
# opportunity. Settings → Composing writes this too, and what is set there wins;
# this is the default a fresh install starts from.
#
# Every queued message has "Send now" and "Cancel send" on it whatever this
# says, so the delay only decides how long the default is, not whether you can
# intervene. A delayed message goes out within one poll_interval of its
# deadline, not on it: the agent is not woken for a send it would refuse.
send_delay_seconds = 0

# Once a day, fetch the VERSION file from meerail's default branch and let the
# UI say so if it is newer than this build (sidebar strip, Settings → About).
#
# This is the only outbound request the server ever makes. It sends nothing but
# the request itself — no identifier, no version, no statistics — so the far end
# learns that some address asked for a file and nothing else. Set false and it
# makes no request at all; `meerail.sh update` and the release page still work.
update_check = true

# Scratch space for outgoing attachment staging; mail bytes live in Postgres.
# Left unset it is ./data beside this file, and every container overrides it to
# /data through the environment — so it is usually not worth setting here.
# data_dir = "./data"


# --- agent --------------------------------------------------------------------
# The agent runs on the machine where Proton Bridge is installed. It reads your
# Bridge IMAP/SMTP credentials (shown in the Bridge app — NOT your Proton
# password), fetches and parses your mail, and writes it into the database the
# web app reads. It owns the whole pipeline, so it calls Tika itself.
[agent]
# Also published on the host's loopback by docker-compose. On the compose
# network it is tika:9998, which those containers get from the environment.
tika_url = "http://127.0.0.1:9998"

poll_interval      = 30    # seconds between IDLE cycles
reconcile_interval = 900   # seconds between full flag/prune sweeps
batch_size         = 200   # UIDs per fetch/ingest batch; an account may override it

# Keep the original RFC822 bytes of every message in the database. Nothing in
# the app reads them today — they are held so future features (export,
# re-parsing, signature checks) have the original to work from — and they are
# roughly half of the database's size. Set false to ingest without them.
# Applies to mail synced from then on: rows already stored keep their copy, and
# switching back on does not go back and fill in the gap.
store_raw_mime = true

# Largest incoming message the agent will hold in memory to store, in bytes; 0
# is no limit. A fetch reads the whole message before it is parsed, so one mail
# carrying somebody's backup is that many bytes resident at once — and the pass
# dies on the same UID every time it retries. Past the cap the message is stored
# as headers alone, exactly as mail outside the content window is: listed,
# threaded and searchable, with no body to open. Raising it and running a
# recheck brings the body in.
max_message_bytes = 104857600  # 100 MB

# Only keep the *content* of mail sent within this many months; 0 keeps
# everything. Older mail is fetched as headers alone — it still lists, threads,
# sorts and answers a search for its subject or correspondent, but it has no
# body to open, and the reader says so. The body never crosses the wire: the age
# is read from the cheap header pass, before the message is asked for.
#
# The window slides. Mail already stored is stripped back to headers once it
# falls out of it, so this is what the database keeps, not just what it fetches.
# Nothing is touched on the mail server — the full message is still there.
#
# Widening it later applies to new mail; use the UI's full recheck to re-walk
# the mailbox and pull down the content that is now back inside the window.
#
# The agent publishes this number to the database on every pass, which is how
# the web app can explain a missing body without reading this file — so a server
# on another machine needs no copy of it.
content_window_months = 0


# One [[agent.account]] block per address; accounts register themselves in the
# app on first sync. Add more blocks for multiple accounts.
[[agent.account]]
email        = "you@proton.me"
imap_host    = "127.0.0.1"
imap_port    = 1143            # Bridge default IMAP port
imap_security = "starttls"     # starttls | ssl | plain
smtp_host    = "127.0.0.1"
smtp_port    = 1025            # Bridge default SMTP port
smtp_security = "starttls"
username     = "you@proton.me" # the Bridge username; defaults to `email`
password     = "BRIDGE-PASSWORD-HERE"
verify_cert  = false           # Bridge uses a self-signed cert; false trusts it
# Socket timeouts, in seconds. These bound a *stall*, not a slow transfer: the
# read timeout only fires if the server sends nothing at all for that long.
# Raise imap_read_timeout if a genuinely slow Bridge starts reporting timeouts
# mid-backfill; without it a hung Bridge parks the sync thread silently.
imap_connect_timeout = 10
imap_read_timeout    = 60

# The same guarantee for the send path. smtplib defaults to no timeout at all,
# and the outgoing drain runs on the sync thread — so one SMTP server that
# stops answering would stop this account syncing, not just sending.
smtp_timeout         = 60

# The name recipients see in front of your address — the display name on the
# From header of everything this account sends. Leave it out and mail goes out
# as the bare address.
# name = "Your Name"

# Extra addresses this Proton account can send from (aliases / additional
# addresses you own in Proton). They appear in the compose "From" dropdown.
# The primary `email` above is always sendable and need not be repeated here.
# addresses = ["alias@proton.me", "you@customdomain.com"]
#
# An entry may also be written `Name <address>`, which names that one address
# instead of using `name` above — including the primary, which is the one
# reason to list it here:
# addresses = [
#   "You At Work <you@proton.me>",
#   "Your Name <you@customdomain.com>",
# ]

# How the account looks in the web UI: its name in the sidebar, the colour of
# its dot, and the footer the composer prefills into every new message. All
# three are normally edited in Settings → Accounts and left out of this file.
#
# Set one here and this file owns it: the agent writes it onto the account on
# every pass, so an edit here reaches the UI on the next sync, and Settings
# shows it as configured rather than editable — it would otherwise accept a
# change that the next sync silently undid. Delete the key again and Settings
# takes it back, keeping whatever value this file last gave it.
#
# `label` is the account's name in *your* sidebar and never leaves the UI; it is
# not `name` above, which is what recipients see on the From header.
# label  = "Personal"
# color  = "#1d6ff2"            # hex, or a CSS colour name
# footer = """
# ----
# Sent from meerail"""          # footer = "" gives this account no footer at all

# The agent speaks plain IMAP/SMTP, so non-Proton providers work too. Gmail
# example (needs 2-Step Verification + an App Password, and IMAP enabled in
# Gmail settings — your normal Google password will NOT work):
#
# [[agent.account]]
# email         = "you@gmail.com"
# imap_host     = "imap.gmail.com"
# imap_port     = 993
# imap_security = "ssl"
# smtp_host     = "smtp.gmail.com"
# smtp_port     = 465
# smtp_security = "ssl"
# username      = "you@gmail.com"
# password      = "your-16-char-app-password"
# verify_cert   = true          # real certificate — keep verification on
# # Gmail is far less tolerant of a large fetch than Bridge is: ask for 200
# # full messages at once and it starts answering with UIDs missing, or drops
# # the connection mid-FETCH. Either one ends the pass, and a mailbox big
# # enough to need hours of backfill never gets to the end of one. Keep this
# # low for Gmail — it costs more round trips and finishes.
# batch_size    = 25
