# meerail — isolated test stack.
#
# Standalone (NOT an overlay on docker-compose.yml): the production stack holds
# real mail, and the suite truncates every table it can reach. Run it under its
# own project name so containers, networks and volumes can never collide with
# production:
#
#   docker compose -p meerail-test -f docker-compose.test.yml up -d
#
# `make test` does that, and wipes the volume first so every run starts on a
# freshly initdb'd cluster. Ports are shifted off the production ones so both
# stacks can run at once.
services:
  db:
    image: postgres:18
    # Test-sized: the production tuning asks for 4GB of shared_buffers, which is
    # pointless for a suite whose whole dataset is a few dozen messages.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - maintenance_work_mem=256MB   # still builds the GIN trigram index
      - -c
      - fsync=off                    # safe: the volume is discarded after each run
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: meerail
      POSTGRES_PASSWORD: meerail
      # The _test suffix is load-bearing — tests/conftest.py refuses to run
      # against a database whose name does not end in it.
      POSTGRES_DB: meerail_test
    ports:
      # Shifted off 5432 so this never binds over the production database.
      - "127.0.0.1:55432:5432"
    volumes:
      # Same mount layout as production (see docker-compose.yml); `make test`
      # removes it with `down -v` before each run, which is what makes the
      # cluster clean rather than merely truncated.
      - pg-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meerail -d meerail_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  tika:
    # Same image as production, so this reuses the already-built one rather than
    # rebuilding on the (large) -full variant again. Only test_ingest.py's
    # attachment-extraction cases need it.
    image: meerail-tika
    build: ./tika
    ports:
      - "127.0.0.1:59998:9998"
    # The host to bind, and nothing else. This used to carry `-noFork` to keep
    # Tika in one process, because the 3.x watchdog-plus-child arrangement did
    # not come back from a heap exhaustion: the child was restarted and every
    # request afterwards was answered 503, for every file, until somebody
    # restarted the container by hand. 4.x parses in forked JVMs always — the
    # flag is gone, and a compose file still passing it stops the container at
    # startup with `Unrecognized option: -noFork` — and so is the failure. A
    # parse that exhausts the heap now ends that one fork, that one document is
    # answered 503, and the next request is served normally. The pool size and
    # the fork's heap are set in the image's tika-config.json; tika/README.md
    # says why they are what they are.
    command: ["-h", "0.0.0.0"]
    environment:
      # This image's entrypoint execs java directly with no $JAVA_OPTS, so that
      # variable is silently ignored; JAVA_TOOL_OPTIONS is read by the JVM, and
      # without a heap cap a JVM under a cgroup limit gets OOM-killed at the
      # ceiling instead of collecting.
      #
      # It applies to every JVM in the container, which since 4.x means the
      # forked parsers as well as this one — hence 15% rather than the 60% it
      # was: this process routes requests and spools oversized bodies to disk,
      # it does not parse, and the fork that does takes 60% of the limit below
      # from tika-config.json, where being on the fork's own command line makes
      # it win over the percentage here. Both heaps have to fit one container.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=15 -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          memory: 2g
    # Same as production. A parse that exhausts the heap is now the forked
    # parser's death rather than the server's, and Tika replaces that itself —
    # but the server JVM still exits on an unrecoverable heap failure of its
    # own, and nothing brings it back without this.
    restart: unless-stopped
    healthcheck:
      # So a Tika that has stopped answering shows up as unhealthy rather than
      # as an indexing queue that quietly stops moving.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9998/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  languagetool:
    # The grammar checker, under the same `grammar` profile as production, so a
    # plain `make test` neither pulls nor starts it and CI stays as fast as it
    # was. The live half of tests/test_grammar.py skips without it; run it
    # with `COMPOSE_PROFILES=grammar make test`. No host port: only the server
    # talks to it, over this project's network.
    image: erikvl87/languagetool:6.8
    profiles: ["grammar"]
    environment:
      Java_Xms: 256m
      # Smaller than production: the suite checks English and German only.
      Java_Xmx: 768m
      langtool_cacheSize: "1000"
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      # Short interval so `up --wait` (make test-up) returns as soon as the
      # checker answers, rather than after the image's default 30 seconds.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --data 'language=en-US&text=a simple test' http://localhost:8010/v2/check || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 60s

  server:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Shifted off 8000: the suite's MEERAIL_URL points here, and /healthz
      # reports the database name so conftest can prove it is not production.
      - "127.0.0.1:18000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://meerail:meerail@db:5432/meerail_test
      SECRET_KEY: test-insecure
      DATA_DIR: /data
      TIKA_URL: http://tika:9998
      # 0 = no window, so seeded fixtures dated in the past stay findable. The
      # shipped default is a year (server.default_search_years), and the suite
      # dates its fixtures from a fixed T0 — so leaving that default in place
      # would quietly turn the whole of test_search.py red one year after T0,
      # on a calendar rather than on a change. What the default *is* belongs to
      # tests/test_config_unit.py, which can assert it without depending on
      # today's date.
      DEFAULT_SEARCH_YEARS: 0
      CONTACTS_SCAN_YEARS: 0
      # The reminder worker's poll interval. A minute in production, because
      # that is how late a reminder may be; two seconds here so the suite can
      # watch a parked conversation come back on its own rather than assert
      # that the code which would have done it exists.
      MEERAIL_REMINDER_TICK: 2
      # The profiled languagetool service above. Set whether or not the profile
      # is on, so GET /api/grammar/config reports the feature as available and
      # its validation can be tested either way; with the profile off the name
      # does not resolve, and every real check answers 503, which is what the
      # live tests skip on.
      GRAMMAR_URL: http://languagetool:8010
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pg-test-data:
